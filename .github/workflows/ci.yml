name: "🚀 MedCare+ CI"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      appium_platform:
        description: "Appium platform"
        required: false
        default: "android"
        type: choice
        options: [android, ios, both, skip]
      load_type:
        description: "Load test type"
        required: false
        default: "smoke"
        type: choice
        options: [smoke, load, stress, all, skip]
      browser:
        description: "Selenium browser"
        required: false
        default: "chrome"
        type: choice
        options: [chrome, firefox, edge]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------
  # Build Flutter Web (used by Selenium & Load tests)
  # -----------------------------------------------------------------
  build_web:
    name: "🔨 Build Flutter Web"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

          cache: true
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-web
          path: build/web/
          retention-days: 3

  # -----------------------------------------------------------------
  # Selenium matrix tests (functional, UI‑UX, etc.)
  # -----------------------------------------------------------------
  selenium:
    name: "🌐 Selenium (${{ matrix.suite }})"
    runs-on: ubuntu-latest
    needs: build_web
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [functional, ui-ux-compatibility, performance-security, api-database, accessibility-mobile, regression-e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flutter-web
          path: build/web/
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: selenium_tests/package-lock.json
      - name: Install Selenium deps
        working-directory: selenium_tests
        run: npm ci --prefer-offline
      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: "stable"
      - uses: nanasess/setup-chromedriver@v2
      - name: Create reports dir
        working-directory: selenium_tests
        run: mkdir -p reports
      - name: Run Selenium suite
        working-directory: selenium_tests
        env:
          HEADLESS: "true"
          TEST_BROWSER: ${{ inputs.browser || 'chrome' }}
          TEST_SUITE: ${{ matrix.suite }}
          CI: "true"
        run: node run_tests.js
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-${{ matrix.suite }}
          path: |
            selenium_tests/reports/*.xlsx
            selenium_tests/reports/*.csv
          retention-days: 30

  # -----------------------------------------------------------------
  # Selenium summary (collects all suite results)
  # -----------------------------------------------------------------
  selenium_summary:
    name: "🌐 Selenium Summary"
    runs-on: ubuntu-latest
    needs: selenium
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: selenium-*
          path: selenium_reports/
          merge-multiple: true
      - name: Write Selenium status JSON
        run: |
          mkdir -p ci_meta
          echo '{
            "suite": "Selenium",
            "icon": "🌐",
            "status": "${{ needs.selenium.result }}",
            "browser": "${{ inputs.browser || 'chrome' }}",
            "suites": ["functional","ui-ux-compatibility","performance-security","api-database","accessibility-mobile","regression-e2e"]
          }' > ci_meta/selenium_status.json
      - uses: actions/upload-artifact@v4
        with:
          name: ci-selenium-meta
          path: ci_meta/selenium_status.json
          retention-days: 7

  # -----------------------------------------------------------------
  # Load tests (smoke / normal / stress) – built on the same web artifact
  # -----------------------------------------------------------------
  build_web_load:
    name: "🔨 Build Flutter Web (Load)"
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.load_type != 'skip' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

          cache: true
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-web-load
          path: build/web/
          retention-days: 1

  smoke_test:
    name: "🔥 Load – Smoke"
    runs-on: ubuntu-latest
    needs: build_web_load
    if: ${{ inputs.load_type != 'skip' && (inputs.load_type == 'smoke' || inputs.load_type == 'all' || inputs.load_type == '' || github.event_name != 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flutter-web-load
          path: build/web/
      - uses: grafana/setup-k6-action@v1
      - name: Serve & run smoke test
        run: |
          npx -y serve build/web -l 8080 &
          sleep 3
          mkdir -p load_tests/reports
          k6 run --out json=reports/smoke_raw.json \
            -e BASE_URL=http://localhost:8080 \
            01_smoke_test.js
        continue-on-error: true
      - name: Generate HTML report
        working-directory: load_tests
        run: node generate_report.js
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-smoke-reports
          path: |
            load_tests/reports/load_smoke_summary.json
            load_tests/reports/load_test_report.html
          retention-days: 30

  load_test:
    name: "⚡ Load – Normal"
    runs-on: ubuntu-latest
    needs: [build_web_load, smoke_test]
    if: ${{ inputs.load_type == 'load' || inputs.load_type == 'all' || github.event_name == 'schedule' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flutter-web-load
          path: build/web/
      - uses: grafana/setup-k6-action@v1
      - name: Serve & run load test
        run: |
          npx -y serve build/web -l 8080 &
          sleep 3
          mkdir -p load_tests/reports
          k6 run --out json=reports/load_raw.json \
            -e BASE_URL=http://localhost:8080 \
            02_load_test.js
        continue-on-error: true
      - name: Generate HTML report
        working-directory: load_tests
        run: node generate_report.js
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-normal-reports
          path: |
            load_tests/reports/load_load_test_summary.json
            load_tests/reports/load_test_report.html
          retention-days: 30

  stress_test:
    name: "💥 Load – Stress"
    runs-on: ubuntu-latest
    needs: [build_web_load, smoke_test]
    if: ${{ inputs.load_type == 'stress' || inputs.load_type == 'all' || github.event_name == 'schedule' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flutter-web-load
          path: build/web/
      - uses: grafana/setup-k6-action@v1
      - name: Serve & run stress test
        run: |
          npx -y serve build/web -l 8080 &
          sleep 3
          mkdir -p load_tests/reports
          k6 run --out json=reports/stress_raw.json \
            -e BASE_URL=http://localhost:8080 \
            03_stress_test.js
        continue-on-error: true
      - name: Generate HTML report
        working-directory: load_tests
        run: node generate_report.js
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-stress-reports
          path: |
            load_tests/reports/load_stress_test_summary.json
            load_tests/reports/load_test_report.html
          retention-days: 30

  load_summary:
    name: "⚡ Load Summary"
    runs-on: ubuntu-latest
    needs: [smoke_test, load_test, stress_test]
    if: always()
    steps:
      - name: Write Load status JSON
        run: |
          mkdir -p ci_meta
          echo '{
            "suite": "Load & Performance",
            "icon": "⚡",
            "status": "${{ needs.smoke_test.result }}",
            "smoke": "${{ needs.smoke_test.result }}",
            "load": "${{ needs.load_test.result }}",
            "stress": "${{ needs.stress_test.result }}"
          }' > ci_meta/load_status.json
      - uses: actions/upload-artifact@v4
        with:
          name: ci-load-meta
          path: ci_meta/load_status.json
          retention-days: 7

  # -----------------------------------------------------------------
  # Appium Android build & tests
  # -----------------------------------------------------------------
  build_android:
    name: "🤖 Build Android APK"
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.appium_platform != 'skip' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/app/outputs/apk/debug/app-debug.apk
          retention-days: 3

  appium_android:
    name: "🤖 Appium Android"
    runs-on: ubuntu-latest
    needs: build_android
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.appium_platform != 'skip' && inputs.appium_platform != 'ios') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-debug-apk
          path: build/app/outputs/apk/debug/
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: appium_tests/requirements.txt
      - name: Install Python deps
        working-directory: appium_tests
        run: pip install -r requirements.txt
      - name: Install Appium & UiAutomator2
        run: |
          npm install -g appium@2
          appium driver install uiautomator2
      - name: Enable KVM (Linux)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get install -y libvirt-clients libvirt-daemon-system
          sudo adduser $USER libvirt && sudo adduser $USER kvm
      - uses: android-actions/setup-android@v3
      - name: Create Android emulator
        run: |
          echo "y" | sdkmanager --install "system-images;android-33;google_apis;x86_64"
          echo "no" | avdmanager create avd --name "Pixel_5_API_33" \
            --package "system-images;android-33;google_apis;x86_64" --device "pixel_5" --force
      - name: Boot emulator
        run: |
          emulator -avd Pixel_5_API_33 -no-audio -no-window -gpu swiftshader_indirect -no-snapshot -wipe-data &
          adb wait-for-device
          timeout 300 bash -c 'while [[ "$(adb shell getprop sys.boot_completed 2>&1)" != "1" ]]; do sleep 5; done'
      - name: Start Appium server
        run: appium --port 4723 --log-level warn & sleep 5
      - name: Install APK on emulator
        run: adb install -r build/app/outputs/apk/debug/app-debug.apk
      - name: Run Appium Android tests
        working-directory: appium_tests
        env:
          PLATFORM: android
          ANDROID_DEVICE: emulator-5554
          ANDROID_VERSION: "13.0"
          ANDROID_APK_PATH: ../build/app/outputs/apk/debug/app-debug.apk
          APPIUM_HOST: "127.0.0.1"
          APPIUM_PORT: "4723"
        run: python run_appium_tests.py
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-android-reports
          path: |
            appium_tests/reports/Appium_android_*.xlsx
            appium_tests/reports/Appium_Latest_android.xlsx
            appium_tests/reports/appium_report_data.json
          retention-days: 30

  # -----------------------------------------------------------------
  # Appium iOS build & tests (runs on macOS)
  # -----------------------------------------------------------------
  appium_ios:
    name: "🍎 Appium iOS"
    runs-on: macos-14
    if: ${{ inputs.appium_platform == 'ios' || inputs.appium_platform == 'both' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

          cache: true
      - run: flutter pub get
      - run: flutter build ios --debug --simulator --no-codesign
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: appium_tests/requirements.txt
      - name: Install Python deps
        working-directory: appium_tests
        run: pip install -r requirements.txt
      - name: Install Appium & XCUITest driver
        run: |
          npm install -g appium@2
          appium driver install xcuitest
      - name: Boot iOS simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone 15" | grep -oE '[0-9A-F-]{36}' | head -1)
          echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
      - name: Install app on simulator
        run: xcrun simctl install "$SIMULATOR_UDID" build/ios/iphonesimulator/Runner.app
      - name: Start Appium server
        run: appium --port 4723 --log-level warn & sleep 5
      - name: Run Appium iOS tests
        working-directory: appium_tests
        env:
          PLATFORM: ios
          IOS_DEVICE: iPhone 15
          IOS_VERSION: "17.0"
          IOS_APP_PATH: ../build/ios/iphonesimulator/Runner.app
          APPIUM_HOST: "127.0.0.1"
          APPIUM_PORT: "4723"
        run: python run_appium_tests.py
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-ios-reports
          path: |
            appium_tests/reports/Appium_ios_*.xlsx
            appium_tests/reports/Appium_Latest_ios.xlsx
            appium_tests/reports/appium_report_data.json
          retention-days: 30

  appium_summary:
    name: "📱 Appium Summary"
    runs-on: ubuntu-latest
    needs: [appium_android, appium_ios]
    if: always()
    steps:
      - name: Write Appium status JSON
        run: |
          mkdir -p ci_meta
          echo '{
            "suite": "Appium Mobile",
            "icon": "📱",
            "android": "${{ needs.appium_android.result }}",
            "ios": "${{ needs.appium_ios.result }}",
            "platform": "${{ inputs.appium_platform || 'android' }}"
          }' > ci_meta/appium_status.json
      - uses: actions/upload-artifact@v4
        with:
          name: ci-appium-meta
          path: ci_meta/appium_status.json
          retention-days: 7

  # -----------------------------------------------------------------
  # Unified CI report – gathers all artifacts & renders a single HTML page
  # -----------------------------------------------------------------
  unified_report:
    name: "📋 Unified CI Report — All Suites"
    runs-on: ubuntu-latest
    needs: [selenium_summary, load_summary, appium_summary]
    if: always()
    steps:
      - name: Prepare reports directory
        run: mkdir -p all_reports

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: all_reports/
          merge-multiple: true

      - name: List collected files (debug)
        run: find all_reports/ -type f | sort || echo "No files found"

      - name: Generate Unified HTML Report
        run: |
          mkdir -p unified_report
          cat > unified_report/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width,initial-scale=1.0" />
            <title>MedCare+ Unified CI Report</title>
            <style>
              body {font-family:Arial,Helvetica,sans-serif;background:#f5f5f5;color:#222;padding:2rem;}
              h1 {margin-bottom:.5rem;}
              .suite {margin-bottom:1.5rem;}
            </style>
          </head>
          <body>
            <h1>MedCare+ Unified CI Report</h1>
            <p>Generated by GitHub Actions – ${{ github.run_id }}</p>
            <div class="suite"><strong>Selenium status:</strong> ${{ needs.selenium_summary.result }}</div>
            <div class="suite"><strong>Load tests status:</strong> ${{ needs.load_summary.result }}</div>
            <div class="suite"><strong>Appium status:</strong> ${{ needs.appium_summary.result }}</div>
            <p>Artifacts are available in the <code>all_reports</code> folder of this run.</p>
          </body>
          </html>
          HTML

      - uses: actions/upload-artifact@v4
        with:
          name: ci-unified-report
          path: unified_report/index.html
          retention-days: 30
