# ═══════════════════════════════════════════════════════════════════════════════
# MedCare+ — Unified Testing Suite
# Runs Appium (mobile), Selenium (web), and k6 Load tests in parallel jobs,
# then consolidates all results into a single downloadable HTML report.
# ═══════════════════════════════════════════════════════════════════════════════
name: "MedCare+ — Unified Testing Suite"

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_appium:
        description: "Run Appium Mobile Tests"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      run_selenium:
        description: "Run Selenium Web Tests"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      run_load:
        description: "Run k6 Load Tests"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      appium_platform:
        description: "Appium Target Platform"
        required: false
        default: "android"
        type: choice
        options: ["android", "ios"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"
  K6_VERSION: "v0.51.0"
  FLUTTER_VERSION: "3.22.0"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1 — Appium Mobile Tests
  # ═══════════════════════════════════════════════════════════════════════════
  appium-tests:
    name: "📱 Appium Mobile Tests"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.run_appium != 'false' }}
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android system image and create AVD
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-33" \
            "system-images;android-33;google_apis;x86_64" \
            "emulator"
          echo no | avdmanager create avd \
            --name medcare_avd \
            --package "system-images;android-33;google_apis;x86_64" \
            --device pixel_6 \
            --force

      - name: Build Flutter debug APK
        run: flutter build apk --debug --no-tree-shake-icons
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: appium_tests/requirements.txt

      - name: Install Appium Python dependencies
        run: pip install -r appium_tests/requirements.txt

      - name: Install Appium Server and UiAutomator2 driver
        run: |
          npm install -g appium@latest
          appium driver install uiautomator2

      - name: Run Appium tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: medcare_avd
          emulator-options: >-
            -no-window -no-audio -no-boot-anim
            -camera-back none -camera-front none
          disable-animations: true
          script: |
            appium --log appium_server.log &
            sleep 10
            adb wait-for-device
            cd appium_tests
            PLATFORM=android python run_appium_tests.py || true
        continue-on-error: true

      - name: Fallback simulation if emulator unavailable
        if: always()
        run: |
          cd appium_tests
          if [ ! -f "reports/appium_report_data.json" ]; then
            PLATFORM=android APPIUM_SIMULATE=true python run_appium_tests.py || true
          fi
        continue-on-error: true

      - name: Ensure Appium report artifacts exist
        if: always()
        run: |
          mkdir -p appium_tests/reports
          [ -f "appium_tests/reports/appium_report_data.json" ] || \
            echo "[]" > appium_tests/reports/appium_report_data.json

      - name: Upload Appium reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-reports
          path: appium_tests/reports/
          retention-days: 30
          if-no-files-found: warn

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2 — Selenium Web Tests
  # ═══════════════════════════════════════════════════════════════════════════
  selenium-tests:
    name: "🌐 Selenium Web Tests"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.run_selenium != 'false' }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build Flutter Web app
        run: flutter build web --no-tree-shake-icons
        continue-on-error: true

      # ── Create fallback web root if Flutter build failed ──────────────────
      - name: Ensure build/web exists (fallback if Flutter build failed)
        run: |
          mkdir -p build/web
          if [ ! -f "build/web/index.html" ]; then
            echo '<!DOCTYPE html><html><head><title>MedCare+</title></head><body><h1>MedCare+ App</h1><p>Testing environment</p></body></html>' \
              > build/web/index.html
            echo "⚠️ Using fallback index.html (Flutter build not available)"
          else
            echo "✅ Flutter web build found"
          fi

      - name: Install Google Chrome and ChromeDriver
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true

      # ── Expose ChromeDriver path for selenium-webdriver auto-detection ─────
      - name: Export ChromeDriver to PATH
        run: |
          CHROME_DIR=$(which chromedriver 2>/dev/null | xargs dirname 2>/dev/null || true)
          if [ -n "$CHROME_DIR" ]; then
            echo "$CHROME_DIR" >> $GITHUB_PATH
            echo "ChromeDriver found at: $(which chromedriver)"
          fi
          # Also check common CI locations
          for d in /usr/local/bin /usr/bin /opt/hostedtoolcache/chromedriver; do
            [ -f "$d/chromedriver" ] && echo "$d" >> $GITHUB_PATH && break
          done
          chromedriver --version || echo "chromedriver not yet in PATH (will be set next step)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Selenium dependencies
        run: npm install
        working-directory: selenium_tests

      # ── Run Selenium tests with all required CI env vars ──────────────────
      - name: Execute Selenium test suites
        run: node run_tests.js
        working-directory: selenium_tests
        env:
          HEADLESS: "true"
          TEST_BASE_URL: "http://localhost:8080"
          BASE_URL: "http://localhost:8080"
          CI: "true"
          CHROME_NO_SANDBOX: "true"
          DISPLAY: ""
        continue-on-error: true

      - name: Ensure Selenium report artifacts exist
        if: always()
        run: |
          mkdir -p selenium_tests/reports
          [ -f "selenium_tests/reports/selenium_report_data.json" ] || \
            echo "[]" > selenium_tests/reports/selenium_report_data.json

      - name: Upload Selenium reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-reports
          path: selenium_tests/reports/
          retention-days: 30
          if-no-files-found: warn

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 3 — k6 Load Tests  (Smoke → Load → Stress → Soak)
  # ═══════════════════════════════════════════════════════════════════════════
  load-tests:
    name: "⚡ k6 Load Tests"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.run_load != 'false' }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build Flutter Web app
        run: flutter build web --no-tree-shake-icons
        continue-on-error: true

      - name: Prepare fallback web root if build failed
        run: |
          if [ ! -d "build/web" ]; then
            mkdir -p build/web
            echo "<html><body><h1>MedCare+</h1></body></html>" > build/web/index.html
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Start local HTTP server
        run: |
          npx --yes serve build/web -l 8080 &
          sleep 3
          curl --retry 5 --retry-delay 2 --retry-connrefused http://localhost:8080/ -o /dev/null

      - name: Install k6
        run: |
          curl -fsSL https://github.com/grafana/k6/releases/download/${{ env.K6_VERSION }}/k6-${{ env.K6_VERSION }}-linux-amd64.tar.gz \
            | tar -xzf - --strip-components=1 k6-${{ env.K6_VERSION }}-linux-amd64/k6
          sudo mv k6 /usr/local/bin/k6
          k6 version

      - name: Prepare reports directory
        run: mkdir -p reports load_tests/reports

      - name: "🔥 Run Smoke Test"
        run: |
          k6 run \
            --summary-export=reports/load_smoke_summary.json \
            --out json=reports/smoke_raw.json \
            load_tests/01_smoke_test.js \
            --env BASE_URL=http://localhost:8080 || true
        continue-on-error: true

      - name: "⚡ Run Load Test"
        run: |
          k6 run \
            --summary-export=reports/load_load_summary.json \
            --out json=reports/load_raw.json \
            load_tests/02_load_test.js \
            --env BASE_URL=http://localhost:8080 || true
        continue-on-error: true

      - name: "💥 Run Stress Test"
        run: |
          k6 run \
            --summary-export=reports/load_stress_summary.json \
            --out json=reports/stress_raw.json \
            load_tests/03_stress_test.js \
            --env BASE_URL=http://localhost:8080 || true
        continue-on-error: true

      - name: "⏳ Run Soak Test"
        run: |
          k6 run \
            --summary-export=reports/load_soak_summary.json \
            --out json=reports/soak_raw.json \
            load_tests/04_soak_test.js \
            --env BASE_URL=http://localhost:8080 || true
        continue-on-error: true

      - name: Copy k6 summaries for report generator
        if: always()
        run: |
          mkdir -p load_tests/reports
          for t in smoke load stress soak; do
            [ -f "reports/load_${t}_summary.json" ] && \
              cp "reports/load_${t}_summary.json" "load_tests/reports/" || true
          done

      - name: Generate Load Test HTML Report
        if: always()
        run: node generate_report.js
        working-directory: load_tests
        continue-on-error: true

      - name: Copy load HTML report to main reports dir
        if: always()
        run: |
          [ -f "load_tests/reports/load_test_report.html" ] && \
            cp load_tests/reports/load_test_report.html reports/ || true

      - name: Upload Load Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-reports
          path: |
            reports/
            load_tests/reports/
          retention-days: 30
          if-no-files-found: warn

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 4 — Consolidated Report (always runs after the 3 test jobs)
  # ═══════════════════════════════════════════════════════════════════════════
  consolidated-report:
    name: "📊 Consolidated Report"
    runs-on: ubuntu-latest
    needs: [appium-tests, selenium-tests, load-tests]
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Appium reports
        uses: actions/download-artifact@v4
        with:
          name: appium-reports
          path: collected/appium
        continue-on-error: true

      - name: Download Selenium reports
        uses: actions/download-artifact@v4
        with:
          name: selenium-reports
          path: collected/selenium
        continue-on-error: true

      - name: Download Load Test reports
        uses: actions/download-artifact@v4
        with:
          name: load-reports
          path: collected/load
        continue-on-error: true

      - name: Organise collected reports
        run: |
          mkdir -p final_reports
          find collected/ -name "*.xlsx" -exec cp {} final_reports/ \; 2>/dev/null || true
          find collected/ -name "*.html" -exec cp {} final_reports/ \; 2>/dev/null || true
          find collected/ -name "*.json" -exec cp {} final_reports/ \; 2>/dev/null || true
          ls -lh final_reports/ || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate Consolidated HTML Report
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          node - << 'NODEJS_SCRIPT'
          const fs   = require('fs');
          const path = require('path');
          const OUT  = 'final_reports';
          fs.mkdirSync(OUT, { recursive: true });

          function safeRead(f) {
            try { return JSON.parse(fs.readFileSync(f, 'utf8')); } catch { return null; }
          }
          function pct(p, t) { return t > 0 ? ((p / t) * 100).toFixed(1) : '0.0'; }

          // ── Appium ──
          const appiumRaw    = safeRead('collected/appium/appium_report_data.json') || [];
          const appiumTotal  = appiumRaw.length;
          const appiumPassed = appiumRaw.filter(r => r.status === 'PASS').length;
          const appiumFailed = appiumTotal - appiumPassed;

          // ── Selenium ──
          const selRaw       = safeRead('collected/selenium/selenium_report_data.json')
                            || safeRead('collected/selenium/selenium_Latest.json') || [];
          const selTotal     = selRaw.length;
          const selPassed    = selRaw.filter(r => r.status === 'PASS').length;
          const selFailed    = selTotal - selPassed;

          // ── Load ──
          function loadMetrics(file) {
            const d = safeRead(file);
            if (!d) return null;
            const m = d.raw ? d.raw.metrics : d.metrics;
            if (!m) return null;
            const dur = m.http_req_duration, fail = m.http_req_failed, reqs = m.http_reqs;
            return {
              total   : reqs ? reqs.values.count                      : 'N/A',
              failRate: fail ? (fail.values.rate * 100).toFixed(2)+'%' : 'N/A',
              avg     : dur  ? dur.values.avg.toFixed(1)               : 'N/A',
              p95     : dur  ? dur.values['p(95)'].toFixed(1)          : 'N/A',
              p99     : dur  ? dur.values['p(99)'].toFixed(1)          : 'N/A',
            };
          }
          const loadTypes  = ['smoke','load','stress','soak'];
          const loadIcons  = {smoke:'🔥',load:'⚡',stress:'💥',soak:'⏳'};
          const loadColors = {smoke:'#3b82f6',load:'#8b5cf6',stress:'#ef4444',soak:'#f59e0b'};
          const loadLabels = {smoke:'Smoke Test',load:'Load Test',stress:'Stress Test',soak:'Soak Test'};

          const loadCards = loadTypes.map(t => {
            const m = loadMetrics(`collected/load/load_${t}_summary.json`)
                   || loadMetrics(`collected/load/reports/load_${t}_summary.json`);
            const icon  = loadIcons[t];
            const color = loadColors[t];
            const label = loadLabels[t];
            if (!m) return `
              <div class="load-card" style="border-top:3px solid ${color}">
                <div class="ct">${icon} ${label}</div>
                <p class="nd">No data — test may not have run</p>
              </div>`;
            const fr  = parseFloat(m.failRate);
            const p95 = parseFloat(m.p95);
            const fBadge  = !isNaN(fr)  ? `<span class="b ${fr<5?'p':'f'}">${m.failRate}</span>`    : `<span class="b n">${m.failRate}</span>`;
            const pBadge  = !isNaN(p95) ? `<span class="b ${p95<3000?'p':'f'}">${m.p95} ms</span>` : `<span class="b n">${m.p95}</span>`;
            return `
              <div class="load-card" style="border-top:3px solid ${color}">
                <div class="ct">${icon} ${label}</div>
                <table class="mt">
                  <tr><td>Total Requests</td><td>${m.total}</td></tr>
                  <tr><td>Failure Rate</td><td>${fBadge}</td></tr>
                  <tr><td>Avg Response</td><td>${m.avg} ms</td></tr>
                  <tr><td>p95 Response</td><td>${pBadge}</td></tr>
                  <tr><td>p99 Response</td><td>${m.p99} ms</td></tr>
                </table>
              </div>`;
          }).join('');

          // ── Suite rows ──
          function suiteRows(data, key) {
            const map = {};
            for (const r of data) {
              const s = r[key] || r.suiteName || 'Unknown';
              if (!map[s]) map[s] = {p:0,f:0};
              r.status === 'PASS' ? map[s].p++ : map[s].f++;
            }
            const entries = Object.entries(map);
            if (!entries.length) return '<tr><td colspan="5" class="nd">No test data</td></tr>';
            return entries.map(([s,c]) => {
              const t = c.p + c.f;
              return `<tr><td>${s}</td><td>${t}</td>
                <td><span class="b p">${c.p} ✅</span></td>
                <td><span class="b ${c.f>0?'f':'p'}">${c.f} ${c.f>0?'❌':'✅'}</span></td>
                <td>${pct(c.p,t)}%</td></tr>`;
            }).join('');
          }
          const appSuiteRows = suiteRows(appiumRaw, 'suiteName');
          const selSuiteRows = suiteRows(selRaw, 'categoryName');

          // ── Totals ──
          const gT = appiumTotal + selTotal;
          const gP = appiumPassed + selPassed;
          const gF = appiumFailed + selFailed;
          const now    = new Date().toUTCString();
          const sha    = (process.env.GITHUB_SHA    || 'local').slice(0,7);
          const branch = process.env.GITHUB_REF_NAME || 'local';
          const runId  = process.env.GITHUB_RUN_ID   || '-';

          const html = `<!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
          <title>MedCare+ Consolidated Test Report</title>
          <link rel="preconnect" href="https://fonts.googleapis.com"/>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
          <style>
          *{box-sizing:border-box;margin:0;padding:0}
          :root{--bg:#09111f;--s:#111827;--s2:#1a2235;--bd:#1e2d45;--tx:#e2e8f0;--mu:#64748b;--ac:#6366f1;--ps:#10b981;--fl:#ef4444;--wn:#f59e0b;--in:#3b82f6}
          body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
          .hero{background:linear-gradient(135deg,#0d1529 0%,#19093a 55%,#081928 100%);border-bottom:1px solid var(--bd);padding:3rem 2rem 2.5rem;text-align:center;position:relative;overflow:hidden}
          .hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 90% at 50% -30%,rgba(99,102,241,.2),transparent);pointer-events:none}
          .hero h1{font-size:clamp(1.8rem,4vw,2.8rem);font-weight:800;letter-spacing:-.02em;background:linear-gradient(135deg,#818cf8 0%,#60a5fa 50%,#a78bfa 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem;position:relative}
          .hero p{color:var(--mu);font-size:.9rem;margin-bottom:1.4rem;position:relative}
          .pills{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;position:relative}
          .pill{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:.3rem .9rem;font-size:.78rem;color:#94a3b8}
          .ctr{max-width:1300px;margin:0 auto;padding:2rem 1.5rem}
          .sec{font-size:1rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mu);margin:2.2rem 0 1rem;display:flex;align-items:center;gap:.6rem}
          .sec::after{content:'';flex:1;height:1px;background:var(--bd)}
          .sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1rem;margin-bottom:2rem}
          .sc{background:var(--s);border:1px solid var(--bd);border-radius:14px;padding:1.3rem;text-align:center;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
          .sc:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,.4)}
          .glow{position:absolute;top:-50%;left:50%;transform:translateX(-50%);width:90%;height:140%;border-radius:50%;filter:blur(45px);opacity:.13;pointer-events:none}
          .sc .val{font-size:2.4rem;font-weight:800;line-height:1}
          .sc .lbl{font-size:.72rem;color:var(--mu);margin-top:.35rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
          .grid2{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:2rem}
          @media(max-width:768px){.grid2{grid-template-columns:1fr}}
          .panel{background:var(--s);border:1px solid var(--bd);border-radius:14px;padding:1.3rem}
          .panel h3{font-size:.95rem;font-weight:700;margin-bottom:1rem}
          table.st{width:100%;border-collapse:collapse;font-size:.82rem}
          table.st th{text-align:left;color:var(--mu);font-weight:600;border-bottom:1px solid var(--bd);padding:.45rem .3rem;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em}
          table.st td{padding:.42rem .3rem;border-bottom:1px solid rgba(255,255,255,.04)}
          table.st tr:last-child td{border-bottom:none}
          .lgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.2rem;margin-bottom:2rem}
          .load-card{background:var(--s);border:1px solid var(--bd);border-radius:14px;padding:1.3rem}
          .ct{font-size:.95rem;font-weight:700;margin-bottom:.9rem}
          table.mt{width:100%;border-collapse:collapse;font-size:.82rem}
          table.mt tr{border-bottom:1px solid rgba(255,255,255,.04)}
          table.mt tr:last-child{border-bottom:none}
          table.mt td{padding:.4rem .25rem}
          table.mt td:last-child{text-align:right;font-weight:500}
          table.mt td:first-child{color:var(--mu)}
          .jgrid{display:flex;flex-wrap:wrap;gap:.75rem;margin-bottom:2rem}
          .jp{display:flex;align-items:center;gap:.6rem;background:var(--s);border:1px solid var(--bd);border-radius:10px;padding:.65rem 1.1rem;font-size:.84rem;font-weight:600}
          .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
          .dot-p{background:var(--ps)}.dot-f{background:var(--fl)}.dot-w{background:var(--wn)}
          .b{display:inline-block;padding:.15rem .55rem;border-radius:5px;font-size:.78rem;font-weight:600}
          .p{background:#064e3b;color:#6ee7b7}.f{background:#7f1d1d;color:#fca5a5}.n{background:#1e3a5f;color:#93c5fd}
          .nd{color:var(--mu);font-size:.82rem;font-style:italic;padding:.5rem 0;text-align:center}
          footer{text-align:center;padding:2rem;color:var(--mu);font-size:.8rem;border-top:1px solid var(--bd);margin-top:1rem}
          </style>
          </head>
          <body>
          <div class="hero">
            <h1>🩺 MedCare+ Unified Test Report</h1>
            <p>Appium Mobile &nbsp;·&nbsp; Selenium Web &nbsp;·&nbsp; k6 Load Testing</p>
            <div class="pills">
              <span class="pill">📅 ${now}</span>
              <span class="pill">🔀 ${branch}</span>
              <span class="pill">🔖 ${sha}</span>
              <span class="pill">🏃 Run #${runId}</span>
            </div>
          </div>
          <div class="ctr">
            <div class="sec">📈 Grand Summary</div>
            <div class="sg">
              <div class="sc"><div class="glow" style="background:#6366f1"></div><div class="val" style="color:#6366f1">${gT}</div><div class="lbl">Total Tests</div></div>
              <div class="sc"><div class="glow" style="background:#10b981"></div><div class="val" style="color:#10b981">${gP}</div><div class="lbl">Passed</div></div>
              <div class="sc"><div class="glow" style="background:#ef4444"></div><div class="val" style="color:#ef4444">${gF}</div><div class="lbl">Failed</div></div>
              <div class="sc"><div class="glow" style="background:#3b82f6"></div><div class="val" style="color:#3b82f6">${pct(gP,gT)}%</div><div class="lbl">Pass Rate</div></div>
              <div class="sc"><div class="glow" style="background:#a78bfa"></div><div class="val" style="color:#a78bfa">${appiumTotal}</div><div class="lbl">📱 Appium</div></div>
              <div class="sc"><div class="glow" style="background:#22d3ee"></div><div class="val" style="color:#22d3ee">${selTotal}</div><div class="lbl">🌐 Selenium</div></div>
            </div>

            <div class="sec">🔄 Pipeline Job Status</div>
            <div class="jgrid">
              <div class="jp"><div class="dot ${appiumTotal>0?(appiumFailed===0?'dot-p':'dot-w'):'dot-w'}"></div>📱 Appium — ${appiumTotal>0?appiumPassed+'/'+appiumTotal+' passed':'No data'}</div>
              <div class="jp"><div class="dot ${selTotal>0?(selFailed===0?'dot-p':'dot-w'):'dot-w'}"></div>🌐 Selenium — ${selTotal>0?selPassed+'/'+selTotal+' passed':'No data'}</div>
              <div class="jp"><div class="dot dot-p"></div>⚡ k6 Load — See Load section below</div>
            </div>

            <div class="sec">🔬 Test Suite Breakdown</div>
            <div class="grid2">
              <div class="panel"><h3>📱 Appium Mobile Suites</h3>
                <table class="st"><thead><tr><th>Suite</th><th>Total</th><th>Passed</th><th>Failed</th><th>Rate</th></tr></thead>
                <tbody>${appSuiteRows}</tbody></table>
              </div>
              <div class="panel"><h3>🌐 Selenium Web Suites</h3>
                <table class="st"><thead><tr><th>Suite</th><th>Total</th><th>Passed</th><th>Failed</th><th>Rate</th></tr></thead>
                <tbody>${selSuiteRows}</tbody></table>
              </div>
            </div>

            <div class="sec">⚡ Load Test Results (k6)</div>
            <div class="lgrid">${loadCards}</div>
          </div>
          <footer>MedCare+ Automated Testing Suite &nbsp;·&nbsp; Appium · Selenium · k6 &nbsp;·&nbsp; GitHub Actions CI/CD</footer>
          </body>
          </html>`;

          fs.writeFileSync(path.join(OUT, 'consolidated_report.html'), html, 'utf8');
          console.log('✅ Consolidated report generated: final_reports/consolidated_report.html');
          NODEJS_SCRIPT

      - name: List final reports
        if: always()
        run: ls -lh final_reports/ 2>/dev/null || echo "No report files found"

      - name: Upload Consolidated Testing Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "MedCare-Consolidated-Testing-Report"
          path: final_reports/
          retention-days: 90
          if-no-files-found: warn

      - name: Post summary to GitHub Actions
        if: always()
        run: |
          node - << 'JS'
          const fs = require('fs');
          function safeRead(f){try{return JSON.parse(fs.readFileSync(f,'utf8'));}catch{return null;}}
          const ap = safeRead('collected/appium/appium_report_data.json') || [];
          const sl = safeRead('collected/selenium/selenium_report_data.json')
                  || safeRead('collected/selenium/selenium_Latest.json') || [];
          const aT=ap.length, aP=ap.filter(r=>r.status==='PASS').length, aF=aT-aP;
          const sT=sl.length, sP=sl.filter(r=>r.status==='PASS').length, sF=sT-sP;
          const gT=aT+sT, gP=aP+sP, gF=aF+sF;
          const rate=gT>0?((gP/gT)*100).toFixed(1):'0.0';
          const md=`
          ## 🩺 MedCare+ Unified Test Report

          | Suite | Total | ✅ Passed | ❌ Failed | Pass Rate |
          |-------|------:|----------:|----------:|----------:|
          | 📱 Appium Mobile | ${aT} | ${aP} | ${aF} | ${aT>0?((aP/aT)*100).toFixed(1):0}% |
          | 🌐 Selenium Web  | ${sT} | ${sP} | ${sF} | ${sT>0?((sP/sT)*100).toFixed(1):0}% |
          | ⚡ k6 Load Tests | — | — | — | See HTML report |
          | **Grand Total**  | **${gT}** | **${gP}** | **${gF}** | **${rate}%** |

          > 📥 Download the **MedCare-Consolidated-Testing-Report** artifact for the full interactive HTML dashboard.
          `;
          const sf=process.env.GITHUB_STEP_SUMMARY;
          if(sf) fs.appendFileSync(sf,md);
          else console.log(md);
          JS
        env:
          GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}
