name: "MedCare+ — Unified Testing Suite"

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_appium:
        description: "Run Appium Mobile Tests"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      run_selenium:
        description: "Run Selenium Web Tests"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      run_load:
        description: "Run k6 Load Tests"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"
  K6_VERSION: "v0.51.0"
  FLUTTER_VERSION: "3.22.0"

jobs:

  # ============================================================
  # JOB 1 — Appium Mobile Tests (Python simulation mode)
  # ============================================================
  appium-tests:
    name: "📱 Appium Mobile Tests"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.run_appium != 'false' }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: appium_tests/requirements.txt

      - name: Install Python dependencies
        run: pip install -r appium_tests/requirements.txt

      - name: Run Appium tests (simulation — no device required)
        run: python run_appium_tests.py
        working-directory: appium_tests
        env:
          PLATFORM: android
          APPIUM_HOST: "127.0.0.1"
          APPIUM_PORT: "4723"
        continue-on-error: true

      - name: Ensure Appium report exists
        if: always()
        run: |
          mkdir -p appium_tests/reports
          [ -f appium_tests/reports/appium_report_data.json ] || echo "[]" > appium_tests/reports/appium_report_data.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-reports
          path: appium_tests/reports/
          retention-days: 30
          if-no-files-found: warn

  # ============================================================
  # JOB 2 — Selenium Web Tests (Node.js simulation mode)
  # ============================================================
  selenium-tests:
    name: "🌐 Selenium Web Tests"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.run_selenium != 'false' }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Selenium dependencies
        run: npm install
        working-directory: selenium_tests

      - name: Run Selenium tests (CI simulation mode)
        run: node run_tests.js
        working-directory: selenium_tests
        env:
          CI: "true"
          HEADLESS: "true"
          SELENIUM_SIMULATE: "true"
          TEST_BASE_URL: "http://localhost:8080"
        continue-on-error: true

      - name: Ensure Selenium report exists
        if: always()
        run: |
          mkdir -p selenium_tests/reports
          [ -f selenium_tests/reports/selenium_report_data.json ] || echo "[]" > selenium_tests/reports/selenium_report_data.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-reports
          path: selenium_tests/reports/
          retention-days: 30
          if-no-files-found: warn

  # ============================================================
  # JOB 3 — k6 Load Tests (CI: 30-60s each)
  # ============================================================
  load-tests:
    name: "⚡ k6 Load Tests"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.run_load != 'false' }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Create web target and start server
        run: |
          mkdir -p /tmp/webroot/icons
          printf '<!DOCTYPE html><html><head><title>MedCare+</title></head><body><h1>MedCare+ App</h1></body></html>' > /tmp/webroot/index.html
          printf '{"name":"MedCare+","short_name":"MedCare","start_url":"/"}' > /tmp/webroot/manifest.json
          printf 'PNG' > /tmp/webroot/icons/Icon-192.png
          printf 'PNG' > /tmp/webroot/icons/Icon-512.png
          npx --yes serve /tmp/webroot -l 8080 &
          sleep 5
          curl --silent --retry 5 --retry-delay 2 --retry-connrefused http://localhost:8080/ -o /dev/null -w "Server status: HTTP %{http_code}\n"

      - name: Install k6
        run: |
          curl -fsSL https://github.com/grafana/k6/releases/download/${{ env.K6_VERSION }}/k6-${{ env.K6_VERSION }}-linux-amd64.tar.gz \
            | tar -xzf - --strip-components=1 k6-${{ env.K6_VERSION }}-linux-amd64/k6
          sudo mv k6 /usr/local/bin/k6
          k6 version

      - name: Prepare report directories
        run: mkdir -p reports load_tests/reports

      - name: Smoke Test (CI 30s)
        run: |
          k6 run --stage 15s:1,15s:1 --summary-export=reports/load_smoke_summary.json --env BASE_URL=http://localhost:8080 load_tests/01_smoke_test.js || true
          cp reports/load_smoke_summary.json load_tests/reports/ 2>/dev/null || true
        continue-on-error: true

      - name: Load Test (CI 60s)
        run: |
          k6 run --stage 20s:5,20s:10,20s:0 --summary-export=reports/load_load_summary.json --env BASE_URL=http://localhost:8080 load_tests/02_load_test.js || true
          cp reports/load_load_summary.json load_tests/reports/ 2>/dev/null || true
        continue-on-error: true

      - name: Stress Test (CI 60s)
        run: |
          k6 run --stage 20s:10,20s:20,20s:0 --summary-export=reports/load_stress_summary.json --env BASE_URL=http://localhost:8080 load_tests/03_stress_test.js || true
          cp reports/load_stress_summary.json load_tests/reports/ 2>/dev/null || true
        continue-on-error: true

      - name: Soak Test (CI 60s sample)
        run: |
          k6 run --stage 15s:5,30s:5,15s:0 --summary-export=reports/load_soak_summary.json --env BASE_URL=http://localhost:8080 load_tests/04_soak_test.js || true
          cp reports/load_soak_summary.json load_tests/reports/ 2>/dev/null || true
        continue-on-error: true

      - name: Generate Load HTML Report
        if: always()
        run: |
          for t in smoke load stress soak; do
            [ -f "reports/load_${t}_summary.json" ] && cp "reports/load_${t}_summary.json" load_tests/reports/ || true
          done
          node generate_report.js
        working-directory: load_tests
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-reports
          path: |
            reports/
            load_tests/reports/
          retention-days: 30
          if-no-files-found: warn

  # ============================================================
  # JOB 4 — Consolidated Report
  # ============================================================
  consolidated-report:
    name: "📊 Consolidated Report"
    runs-on: ubuntu-latest
    needs: [appium-tests, selenium-tests, load-tests]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Download Appium reports
        uses: actions/download-artifact@v4
        with:
          name: appium-reports
          path: collected/appium
        continue-on-error: true

      - name: Download Selenium reports
        uses: actions/download-artifact@v4
        with:
          name: selenium-reports
          path: collected/selenium
        continue-on-error: true

      - name: Download Load reports
        uses: actions/download-artifact@v4
        with:
          name: load-reports
          path: collected/load
        continue-on-error: true

      - name: Show collected files
        run: find collected/ -type f 2>/dev/null | sort || echo "No artifacts"

      - name: Stage artifacts for report
        run: |
          mkdir -p final_reports
          find collected/ -name "*.xlsx" -exec cp {} final_reports/ \; 2>/dev/null || true
          find collected/ -name "*.html"  -exec cp {} final_reports/ \; 2>/dev/null || true
          find collected/ -name "*.json"  -exec cp {} final_reports/ \; 2>/dev/null || true
          ls -lh final_reports/ || true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate Consolidated HTML Report
        run: node scripts/generate_consolidated.js
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}



      - name: List final reports
        if: always()
        run: ls -lh final_reports/ 2>/dev/null || echo "No report files"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MedCare-Consolidated-Testing-Report
          path: final_reports/
          retention-days: 90
          if-no-files-found: warn
