name: "📱 Appium Mobile Tests"

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'appium_tests/**'
      - 'lib/**'
      - 'android/**'
      - 'ios/**'
      - '.github/workflows/appium.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'appium_tests/**'
      - 'lib/**'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Mobile platform to test'
        required: false
        default: 'android'
        type: choice
        options: [android, ios, both]

concurrency:
  group: appium-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: Build Android APK
  # ─────────────────────────────────────────────────────────────────
  build-android:
    name: "🤖 Build Android APK"
    runs-on: ubuntu-latest
    if: ${{ inputs.platform != 'ios' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Android Debug APK
        run: flutter build apk --debug --no-shrink

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/app/outputs/apk/debug/app-debug.apk
          retention-days: 3

  # ─────────────────────────────────────────────────────────────────
  # Job 2: Run Appium Android Tests (Python)
  # ─────────────────────────────────────────────────────────────────
  appium-android:
    name: "🤖 Appium Android Tests"
    runs-on: ubuntu-latest
    needs: build-android
    if: ${{ inputs.platform != 'ios' }}
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-debug-apk
          path: build/app/outputs/apk/debug/

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: appium_tests/requirements.txt

      - name: Install Python test dependencies
        working-directory: appium_tests
        run: pip install -r requirements.txt

      - name: Install Appium server & UiAutomator2 driver
        run: |
          npm install -g appium@2
          appium driver install uiautomator2

      - name: Enable Android emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get install -y libvirt-clients libvirt-daemon-system
          sudo adduser $USER libvirt
          sudo adduser $USER kvm

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android Emulator
        run: |
          echo "y" | sdkmanager --install "system-images;android-33;google_apis;x86_64"
          echo "no" | avdmanager create avd \
            --name "Pixel_5_API_33" \
            --package "system-images;android-33;google_apis;x86_64" \
            --device "pixel_5" \
            --force

      - name: Start Android Emulator
        run: |
          emulator -avd Pixel_5_API_33 \
            -no-audio -no-window -gpu swiftshader_indirect \
            -no-snapshot -wipe-data &
          adb wait-for-device
          timeout 300 bash -c 'while [[ "$(adb shell getprop sys.boot_completed 2>&1)" != "1" ]]; do sleep 5; done'
          echo "✅ Emulator booted"

      - name: Start Appium Server
        run: |
          appium --port 4723 --log-level warn &
          sleep 5
          echo "✅ Appium server started"

      - name: Install APK on emulator
        run: |
          adb install -r build/app/outputs/apk/debug/app-debug.apk
          echo "✅ APK installed"

      - name: Create reports directory
        run: mkdir -p appium_tests/reports

      - name: Run Appium Android tests (Python)
        working-directory: appium_tests
        env:
          PLATFORM: android
          ANDROID_DEVICE: emulator-5554
          ANDROID_VERSION: '13.0'
          ANDROID_APK_PATH: ../build/app/outputs/apk/debug/app-debug.apk
          APPIUM_HOST: '127.0.0.1'
          APPIUM_PORT: '4723'
        run: python run_appium_tests.py
        continue-on-error: true

      - name: Capture emulator screenshot on failure
        if: failure()
        run: adb exec-out screencap -p > appium_tests/reports/emulator_failure_screenshot.png

      - name: Upload Appium Android reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-android-reports
          path: |
            appium_tests/reports/Appium_android_*.xlsx
            appium_tests/reports/Appium_Latest_android.xlsx
            appium_tests/reports/emulator_failure_screenshot.png
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # Job 3: Run Appium iOS Tests — macOS only (Python)
  # ─────────────────────────────────────────────────────────────────
  appium-ios:
    name: "🍎 Appium iOS Tests"
    runs-on: macos-14
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'both' }}
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build iOS Debug App
        run: flutter build ios --debug --simulator --no-codesign

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: appium_tests/requirements.txt

      - name: Install Python test dependencies
        working-directory: appium_tests
        run: pip install -r requirements.txt

      - name: Install Appium server & XCUITest driver
        run: |
          npm install -g appium@2
          appium driver install xcuitest

      - name: Boot iOS Simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone 15" | grep -oE '[0-9A-F-]{36}' | head -1)
          echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "✅ Simulator booted: $UDID"

      - name: Install app on simulator
        run: |
          xcrun simctl install "$SIMULATOR_UDID" \
            build/ios/iphonesimulator/Runner.app

      - name: Start Appium Server
        run: |
          appium --port 4723 --log-level warn &
          sleep 5

      - name: Create reports directory
        run: mkdir -p appium_tests/reports

      - name: Run Appium iOS tests (Python)
        working-directory: appium_tests
        env:
          PLATFORM: ios
          IOS_DEVICE: iPhone 15
          IOS_VERSION: '17.0'
          IOS_APP_PATH: ../build/ios/iphonesimulator/Runner.app
          APPIUM_HOST: '127.0.0.1'
          APPIUM_PORT: '4723'
        run: python run_appium_tests.py
        continue-on-error: true

      - name: Upload Appium iOS reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-ios-reports
          path: |
            appium_tests/reports/Appium_ios_*.xlsx
            appium_tests/reports/Appium_Latest_ios.xlsx
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # Job 4: Consolidated Single-File HTML Report + Summary
  # ─────────────────────────────────────────────────────────────────
  appium-summary:
    name: "📊 Appium — Consolidated Report"
    runs-on: ubuntu-latest
    needs: [appium-android, appium-ios]
    if: always()

    steps:
      - name: Download all Appium reports
        uses: actions/download-artifact@v4
        with:
          pattern: appium-*-reports
          path: appium_reports/
          merge-multiple: true

      - name: List collected report files
        run: ls -lah appium_reports/ || echo "No reports found"

      - name: Generate consolidated single-file HTML report
        run: |
          mkdir -p appium_reports

          # Collect .xlsx filenames for display
          XLSX_LIST=""
          for f in appium_reports/*.xlsx; do
            [ -f "$f" ] && XLSX_LIST="$XLSX_LIST<li><a href=\"$(basename $f)\">$(basename $f)</a></li>"
          done
          [ -z "$XLSX_LIST" ] && XLSX_LIST="<li><em>No Excel reports uploaded (simulation mode or build skipped)</em></li>"

          cat > appium_reports/index.html << HTMLEOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8"/>
            <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
            <title>MedCare+ Appium Mobile Test Report</title>
            <style>
              @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
              *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
              body { font-family: 'Inter', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 2rem 1rem; }

              /* ── Header ── */
              header { text-align: center; margin-bottom: 2.5rem; }
              header h1 {
                font-size: clamp(1.5rem, 4vw, 2.2rem); font-weight: 700;
                background: linear-gradient(135deg, #60a5fa 0%, #34d399 100%);
                -webkit-background-clip: text; -webkit-text-fill-color: transparent;
              }
              header p { color: #64748b; margin-top: .4rem; font-size: .875rem; }

              /* ── Stat cards ── */
              .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; max-width: 900px; margin: 0 auto 2.5rem; }
              .stat-card {
                background: #1e293b; border-radius: 12px; padding: 1.25rem 1rem;
                border: 1px solid rgba(255,255,255,.06); text-align: center;
                transition: transform .2s;
              }
              .stat-card:hover { transform: translateY(-3px); }
              .stat-card .value { font-size: 2rem; font-weight: 700; }
              .stat-card .label { font-size: .75rem; color: #64748b; margin-top: .2rem; letter-spacing: .05em; text-transform: uppercase; }
              .stat-card.blue   .value { color: #60a5fa; }
              .stat-card.green  .value { color: #34d399; }
              .stat-card.red    .value { color: #f87171; }
              .stat-card.yellow .value { color: #fbbf24; }

              /* ── Suites ── */
              .suites { max-width: 900px; margin: 0 auto 2.5rem; display: flex; flex-direction: column; gap: 1rem; }
              .suite {
                background: #1e293b; border-radius: 12px; border: 1px solid rgba(255,255,255,.06);
                overflow: hidden;
              }
              .suite-header {
                display: flex; align-items: center; justify-content: space-between;
                padding: .9rem 1.25rem; cursor: pointer; user-select: none;
                background: rgba(255,255,255,.02);
              }
              .suite-header:hover { background: rgba(255,255,255,.05); }
              .suite-header h2 { font-size: 1rem; font-weight: 600; color: #f1f5f9; display: flex; align-items: center; gap: .5rem; }
              .badge { font-size: .7rem; padding: .2rem .55rem; border-radius: 999px; font-weight: 600; }
              .badge-pass { background: #14532d; color: #4ade80; }
              .badge-fail { background: #450a0a; color: #f87171; }
              .badge-info { background: #1e3a5f; color: #93c5fd; }
              .chevron { transition: transform .25s; color: #64748b; font-size: .8rem; }
              .suite.open .chevron { transform: rotate(90deg); }
              .suite-body { display: none; border-top: 1px solid rgba(255,255,255,.06); }
              .suite.open .suite-body { display: block; }

              /* ── Test table ── */
              table { width: 100%; border-collapse: collapse; font-size: .82rem; }
              th { background: #0f172a; color: #94a3b8; padding: .6rem 1rem; text-align: left; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; font-size: .7rem; }
              td { padding: .65rem 1rem; border-top: 1px solid rgba(255,255,255,.04); color: #cbd5e1; vertical-align: top; }
              tr:hover td { background: rgba(255,255,255,.02); }
              .status-pass { color: #4ade80; font-weight: 700; }
              .status-fail { color: #f87171; font-weight: 700; }
              .status-sim  { color: #fbbf24; font-weight: 600; }
              .err { color: #fb923c; font-size: .75rem; font-style: italic; max-width: 380px; word-break: break-word; }

              /* ── Downloads ── */
              .downloads { max-width: 900px; margin: 0 auto 2.5rem; background: #1e293b; border-radius: 12px; padding: 1.25rem 1.5rem; border: 1px solid rgba(255,255,255,.06); }
              .downloads h3 { font-size: 1rem; font-weight: 600; color: #f1f5f9; margin-bottom: .75rem; }
              .downloads ul { list-style: none; display: flex; flex-wrap: wrap; gap: .5rem; }
              .downloads li a {
                display: inline-block; background: #0f172a; color: #60a5fa;
                padding: .35rem .85rem; border-radius: 6px; font-size: .8rem;
                border: 1px solid rgba(96,165,250,.25); text-decoration: none;
                transition: background .15s;
              }
              .downloads li a:hover { background: rgba(96,165,250,.1); }

              /* ── Meta ── */
              .meta { max-width: 900px; margin: 0 auto; background: #1e293b; border-radius: 12px; padding: 1rem 1.5rem; border: 1px solid rgba(255,255,255,.06); font-size: .8rem; color: #64748b; display: flex; flex-wrap: wrap; gap: .5rem 2rem; }
              .meta span b { color: #94a3b8; }
              a.gh-link { color: #60a5fa; }
            </style>
          </head>
          <body>

            <header>
              <h1>📱 MedCare+ Appium Mobile Test Report</h1>
              <p>All platforms · All suites · Single consolidated view</p>
            </header>

            <!-- ── Stat Cards ── -->
            <div class="stats">
              <div class="stat-card blue">
                <div class="value" id="totalTests">—</div>
                <div class="label">Total Tests</div>
              </div>
              <div class="stat-card green">
                <div class="value" id="passedTests">—</div>
                <div class="label">Passed</div>
              </div>
              <div class="stat-card red">
                <div class="value" id="failedTests">—</div>
                <div class="label">Failed</div>
              </div>
              <div class="stat-card yellow">
                <div class="value" id="passRate">—</div>
                <div class="label">Pass Rate</div>
              </div>
              <div class="stat-card blue">
                <div class="value" id="platformCount">—</div>
                <div class="label">Platforms</div>
              </div>
              <div class="stat-card blue">
                <div class="value" id="suiteCount">—</div>
                <div class="label">Suites</div>
              </div>
            </div>

            <!-- ── Suite Accordion (populated by JS) ── -->
            <div class="suites" id="suitesContainer">
              <p style="text-align:center;color:#64748b;">Loading test data…</p>
            </div>

            <!-- ── Excel Downloads ── -->
            <div class="downloads">
              <h3>📥 Download Excel Reports</h3>
              <ul>$XLSX_LIST</ul>
            </div>

            <!-- ── Run Meta ── -->
            <div class="meta">
              <span><b>Branch:</b> ${{ github.ref_name }}</span>
              <span><b>Commit:</b> ${{ github.sha }}</span>
              <span><b>Run:</b> <a class="gh-link" href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">#${{ github.run_number }}</a></span>
              <span><b>Platform:</b> ${{ inputs.platform || 'android' }}</span>
              <span><b>Android:</b> ${{ needs.appium-android.result }}</span>
              <span><b>iOS:</b> ${{ needs.appium-ios.result }}</span>
            </div>

            <script>
            // ── Inline test data (injected by runner via JSON sidecar if present) ──────
            // The Python runner writes appium_report_data.json alongside the Excel file.
            // If available, we parse and render it here; otherwise show a placeholder.
            const DATA_FILE = 'appium_report_data.json';

            const SUITES_ORDER = [
              'App Launch & Onboarding',
              'Medicine Management',
              'Notifications & Reminders',
              'UI Navigation',
              'Offline & Performance',
            ];

            async function loadData() {
              let results = [];
              try {
                const res = await fetch(DATA_FILE);
                if (res.ok) results = await res.json();
              } catch (_) { /* no sidecar – show empty state */ }
              render(results);
            }

            function render(results) {
              const container = document.getElementById('suitesContainer');
              container.innerHTML = '';

              if (!results.length) {
                container.innerHTML = '<p style="text-align:center;color:#64748b;padding:2rem;">No JSON sidecar found. Download the Excel artifacts for detailed results.</p>';
                document.getElementById('totalTests').textContent = '—';
                return;
              }

              // ── Aggregate stats ──────────────────────────────────────
              const total   = results.length;
              const passed  = results.filter(r => r.status === 'PASS').length;
              const failed  = results.filter(r => r.status === 'FAIL').length;
              const rate    = total ? ((passed / total) * 100).toFixed(1) + '%' : '—';
              const platforms = [...new Set(results.map(r => r.platform || '?'))];
              const suites    = [...new Set(results.map(r => r.suiteName))];

              document.getElementById('totalTests').textContent  = total;
              document.getElementById('passedTests').textContent = passed;
              document.getElementById('failedTests').textContent = failed;
              document.getElementById('passRate').textContent    = rate;
              document.getElementById('platformCount').textContent = platforms.length || 1;
              document.getElementById('suiteCount').textContent  = suites.length;

              // ── Suite accordion ──────────────────────────────────────
              const grouped = {};
              results.forEach(r => {
                const key = `${r.platform || 'android'}::${r.suiteName}`;
                if (!grouped[key]) grouped[key] = [];
                grouped[key].push(r);
              });

              Object.entries(grouped).forEach(([key, rows]) => {
                const [platform, suiteName] = key.split('::');
                const suitePassed = rows.filter(r => r.status === 'PASS').length;
                const suiteFailed = rows.filter(r => r.status === 'FAIL').length;
                const icon = platform === 'ios' ? '🍎' : '🤖';

                const div = document.createElement('div');
                div.className = 'suite';
                div.innerHTML = `
                  <div class="suite-header" onclick="this.parentElement.classList.toggle('open')">
                    <h2>${icon} <span style="color:#94a3b8;font-size:.8rem;margin-right:.25rem">[${platform.toUpperCase()}]</span>${suiteName}
                      <span class="badge badge-pass">✅ ${suitePassed}</span>
                      ${suiteFailed ? '<span class="badge badge-fail">❌ ' + suiteFailed + '</span>' : ''}
                    </h2>
                    <span class="chevron">▶</span>
                  </div>
                  <div class="suite-body">
                    <table>
                      <thead><tr><th>#</th><th>Test Case</th><th>Status</th><th>Duration</th><th>Notes</th></tr></thead>
                      <tbody>${rows.map((r, i) => `
                        <tr>
                          <td>${i + 1}</td>
                          <td>${r.title}</td>
                          <td class="${r.status === 'PASS' ? 'status-pass' : r.error?.includes('SIMULATED') ? 'status-sim' : 'status-fail'}">${r.status}</td>
                          <td>${r.durationMs ?? 0} ms</td>
                          <td class="err">${r.error || ''}</td>
                        </tr>`).join('')}
                      </tbody>
                    </table>
                  </div>`;
                container.appendChild(div);
              });
            }

            loadData();
            </script>
          </body>
          </html>
          HTMLEOF
          echo "✅ Consolidated HTML report generated → appium_reports/index.html"

      - name: Post summary to GitHub Job Summary
        if: always()
        run: |
          echo "## 📱 Appium Mobile Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔀 Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏃 Run | [${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| 📱 Platform | ${{ inputs.platform || 'android' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🤖 Android | ${{ needs.appium-android.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🍎 iOS | ${{ needs.appium-ios.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Download Consolidated Report" >> $GITHUB_STEP_SUMMARY
          echo "Download the **\`appium-all-reports\`** artifact — it contains:" >> $GITHUB_STEP_SUMMARY
          echo "- \`index.html\` — single-file report showing **all suites & platforms**" >> $GITHUB_STEP_SUMMARY
          echo "- \`Appium_android_*.xlsx\` — Android detailed Excel results" >> $GITHUB_STEP_SUMMARY
          echo "- \`Appium_ios_*.xlsx\` — iOS detailed Excel results" >> $GITHUB_STEP_SUMMARY

      - name: Upload consolidated Appium all-in-one report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-all-reports
          path: appium_reports/
          retention-days: 30
