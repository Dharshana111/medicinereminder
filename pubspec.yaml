name: medreminder
description: "MedCare+ — Smart Medicine Reminder System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Notifications & Scheduling
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0

  # Text-to-Speech
  flutter_tts: ^4.2.5

  # Local Storage
  shared_preferences: ^2.5.5

  # Image Handling
  image_picker: ^1.2.2
  path_provider: ^2.1.5

  # Charts & UI
  fl_chart: ^1.2.0
  google_fonts: ^8.1.0

  # Permissions
  permission_handler: ^12.0.2

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
